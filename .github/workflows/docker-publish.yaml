# This is boilerplate for publishing a Docker image via Github Actions.

name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "develop" ]
    # Publish semver tags as releases.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches: [ "main", "master", "develop" ]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (root)
        id: meta-root
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-root

      - name: Extract Docker metadata (nonroot)
        id: meta-nonroot
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-nonroot

      - name: Extract Docker metadata (script)
        id: meta-script
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-script

      - name: Build and push Docker image (root)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: root
          tags: ${{ steps.meta-root.outputs.tags }}
          labels: ${{ steps.meta-root.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (nonroot)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: nonroot
          tags: ${{ steps.meta-nonroot.outputs.tags }}
          labels: ${{ steps.meta-nonroot.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (script)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: script
          tags: ${{ steps.meta-script.outputs.tags }}
          labels: ${{ steps.meta-script.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
